[core]
name: laser_turret_turret
displayText: laser turret
displayText_ru: Лучевая турель

class: CustomUnitMetadata
price: 0
maxHp: 1
mass: 1000
radius: 18

energyMax: 100 
energyRegen: 0.2
energyNeedsToRechargeToFull: true

#showInEditor: false

[graphics]
total_frames: 4

image: turret.png 

lock_body_rotation_with_main_turret: true

[turret_1]
x:0
y:0

shoot_flame: fire
aimOffsetSpread: 0

projectile: laser1
canAttackCondition: if self.resource.ammo == 1 and self.resource.energy > 70
resourceUsage: energy = 1

[turret_2]
x:0
y:0

shoot_flame: fire
aimOffsetSpread: 0

projectile: laser2
canAttackCondition: if self.resource.ammo == 1 and self.resource.energy > 50
resourceUsage: energy = 1

[turret_3]
x:0
y:0

shoot_flame: fire
aimOffsetSpread: 0

projectile: laser3
canAttackCondition: if self.resource.ammo == 1 and self.resource.energy > 30
resourceUsage: energy = 1

[turret_4]
x:0
y:0

shoot_flame: fire
aimOffsetSpread: 0

projectile: laser4
canAttackCondition: if self.resource.ammo == 1 and self.resource.energy > 0
resourceUsage: energy = 1

[hiddenAction_energy_logic]
autoTrigger: if self.resource.energy >= 100 
addResources: ammo = 1

[hiddenAction_ammo_logic]
autoTrigger: if self.resource.energy <= 1
addResources: ammo = -1

[projectile_laser1]
life: 20
autoTargetingOnDeadTarget: true

beamImage: iazik.png
#beamImageEnd: 
#beamImageStart:

instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true

directDamage: 2

[projectile_laser2]
life: 20
autoTargetingOnDeadTarget: true

beamImage: iazik.png
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true

directDamage: 5

[projectile_laser3]
life: 20
autoTargetingOnDeadTarget: true

beamImage: iazik.png
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true

directDamage: 8

[projectile_laser4]
life: 20
autoTargetingOnDeadTarget: true

beamImage: iazik.png
instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true

directDamage: 12

[effect_fire]
image: ROOT:effect/salp.png

dirOffset:180

xOffsetRelative: 0
yOffsetRelative: 0
fadeInTime: 1

alpha: 0.5
life: 5

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 10
turretTurnSpeed: 2

maxAttackRange: 168

shootDelay: 0.5

[movement]
movementType: NONE
moveSpeed: 0
