[core]
name: fabricatorT1_m 
class: CustomUnitMetadata
price: 2000
maxHp: 500
mass: 1000

displayText: Fabricator
displayText_ru: Фабрикатор

generation_resources: credits=2

#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1

#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1

techLevel: 1
buildSpeed: 12s

radius: 18
isBio: true

isBuilding: true

borrowResourcesWhileAlive: maxfabricator=0

tags: fabricator

[action_cap]
isActive: false
displayType: infoOnly
price: maxfabricator=1
addResources: maxfabricator=1
displayRemainingStockpile: true

[hiddenAction_refund]
requireConditional:  if self.numberOfUnitsInTeam(withTag='fabricator', greaterThan=0, incompleteBuildings=true) and self.resource(type='maxfabricator')<0 
autoTriggerOnEvent: created
addResources: ${core.price}
deleteSelf: true
showMessageToPlayer: You have built the maximum amount of fabricators (40) 
showMessageToPlayer_ru: Вы построили максимально возможное количество фабрикаторов (40)
showMessageToPlayer_zh: 你已经建造了最大数量的资源制造仪 (40)


#[action_upgradeT2]
#convertTo: fabricatorT2

#price:  3000
#text: i:gui.actions.upgradeT2
#description: i:units.fabricator.upgrade.description
#text: i:units.fabricator.upgrade.name
#displayType: upgrade
#buildSpeed: 38.6s

#iconImage: ROOT:icons/improve.png


[graphics]
#total_frames: 3
image: fabricator.png
#image_wreak: fabricator_dead.png

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: NONE
moveSpeed: 0

[ai]
buildPriority: 0.30
noneInBaseExtraPriority: 0.25
recommendedInEachBasePriorityIfUnmet: 0.9
noneGlobalExtraPriority: 0.4
ai_upgradePriority: 0.20

recommendedInEachBaseNum: 4
maxEachBase: 5
#maxGlobal: 40