iconImage: ROOT:icons/улучшение_кокона.png
displayType: Upgrade
price: 1000
buildSpeed: 20s
text: Т2
description: Позволяет создавать юнитов второго класса.
pos: -1

# не даст ИИ активырывать пока у него не появиься достаточно денег (с запасом)
[hiddenAction_upgradeAI]
autoTriggerOnEvent:completeAndActive
requireConditional:if self.hasResources(credits=3000) and self.isControlledByAI
alsoQueueAction:upgrade

