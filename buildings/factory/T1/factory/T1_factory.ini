price: 750
class: CustomUnitMetadata
maxHp: 600
mass: 9000
radius: 36

isBuilding: true

buildSpeed: 15s

exit_x: 0
exit_y: 20

#footprint used for collisions with units (left, up, right, down)
footprint: -1, -1, 1, 1

