[core]
name: remont_pulser
displayText: ремонтная станция

displayDescription: имеет 2 режима работы\n -в 1 ремотритует постройки и юнитов рементным лучем\n -во 2 испускает ремонтрирующие по облости пульсации

class: CustomUnitMetadata
