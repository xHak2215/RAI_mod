[core]
name: RAIextractor
displayText: Extractor
displayDescription: - Generates credits
displayText_ru: Экстрактор Грибсурсов
displayDescription_ru: -z utq

class: CustomUnitMetadata
price: 700
maxHp: 800
mass: 500
#footprint used for collisions with units (left, up, right, down)
footprint: -1,-0,1,1

#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,-1
exit_x: 0
exit_y: 15


generation_credits: 4
generation_delay: 20

techLevel: 1
buildSpeed: 15s
#availableInDemo: true

radius: 20
displayRadius: 20

isBuilding: true
placeOnlyOnResPool: true

selfRegenRate:0.1
selfBuildRate:0.002

effectOnDeath: resourcePoolSmoke
explodeTypeOnDeath: Large

softCollisionOnAll: 3

[hiddenAction_AiDefendPriority]
autoTriggerOnEvent: completeAndActive
sendMessageTo: nearestUnit(withinRange=200, withTag="AiBuilder", relation='own')
sendMessageWithTags: AiDefendPriority


[graphics]
total_frames: 8

image:        ShroomExtract_Anim2.png
image_wreak:  NONE
image_back: NONE
scaleImagesTo: 70
image_offsetY: -15
drawLayer: top

#AUTO
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1




animation_idle_start: 0
animation_idle_end: 7
animation_idle_speed: 6
animation_idle_pingPong: false


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false


[movement]

movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0
moveDecelerationSpeed: 0
maxTurnSpeed: 0
turnAcceleration: 0


[attachment_Greengoon]

x=0
y=0
rotateWithParent: true
onCreateSpawnUnitOf: Greengoon
lockRotation: true
isUnselectable: true
canBeAttackedAndDamaged: false
setDrawLayerOnBottom: true


[ai]


#buildPriority: 0.20
#noneInBaseExtraPriority: 0.25
#
#noneGlobalExtraPriority: 0.4
#
#maxEachBase: 7
#maxGlobal: 13

buildPriority: 1
noneGlobalExtraPriority: 0.4

ai_upgradePriority: 0.9
noneInBaseExtraPriority: 0.5
