[core]
name: NEW_soldier

displayText: soldier
displayText_ru: солдат

displayDescription: the soldier
displayDescription_ru: это обычный солдат\n-"я не хочу на мясной штурм!"\n-"надо боец надо"

showInEditor: true
class: CustomUnitMetadata

mass: 10 
maxHp: 10
price: 45 
radius: 5

buildSpeed: 3s
isBio: true

energyMax: 30
energyRegen: 0
energyNeedsToRechargeToFull: true

[hiddenAction_dead_smert_strahnaia]
autoTriggerOnEvent: destroyed
spawnUnits: dead_spawner

[graphics]
total_frames: 2
scaleImagesTo: 12

animation_attack_start: 1 
animation_attack_speed: 10
animation_attack_end: 1

image: body.png

[hiddenAction_AI_control]
autoTrigger: if self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=95) and self.resource.energy < 1

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-90)
addWaypoint_type: move
allowMultipleInQueue:false

[action_ammo_res]
text: перезарядка

autoTrigger: if self.resource.energy < 1
setResourcesWithLogic: energy = 30

buildSpeed: 1s

[turret_1]
x:0
y:0
barrelX: 2
barrelY: 5

energyUsage: 1

[projectile_1]
directDamage: 1
image: ROOT:effect/pula.png
life: 50

[attack]
canAttack: true 
canAttackFlyingUnits: false 
canAttackLandUnits: true 
canAttackUnderwaterUnits: false

maxAttackRange: 100 
shootDelay: 7.5

[movement]
movementType: LAND 
moveSpeed: 0.8
moveAccelerationSpeed: 1
moveDecelerationSpeed: 1
maxTurnSpeed: 5

reverseSpeedPercentage 0.3