[core]
name: NEW_soldier_rocket_launhcer

displayText: soldier rocket launhcer
displayText_ru: солдат с ракетницей

showInEditor: true
class: CustomUnitMetadata

mass: 10 
maxHp: 10
price: 65
radius: 5

buildSpeed: 4s
isBio: true

copyFrom: ROOT:NEW/other/random_human_dead.template

[graphics]
total_frames: 2
scaleImagesTo: 12

animation_attack_start: 1 
animation_attack_speed: 20
animation_attack_end: 1

#image_wreak: ROOT:NEW/other/dead_human1.png
image: body.png

[hiddenAction_AI_control]
autoTrigger: if self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=100)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-90)
addWaypoint_type: move
allowMultipleInQueue:false

[turret_1]
x:0
y:0

warmup: 30 

barrelX: 5
barrelY: 5

[projectile_1]
areaDamage: 30
areaRadius: 25

drawSize: 0.8

speed: 1
armourIgnoreAmount: 1


image: ROOT:effect/rocket.png
life: 150

[attack]
canAttack: true 
canAttackFlyingUnits: false 
canAttackLandUnits: true 
canAttackUnderwaterUnits: false

maxAttackRange: 125 
shootDelay: 120

[movement]
movementType: LAND 
moveSpeed: 0.7
moveAccelerationSpeed: 1
moveDecelerationSpeed: 1
maxTurnSpeed: 5

reverseSpeedPercentage 0.3