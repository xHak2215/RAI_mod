[core]
name: строитель_доходяга
displayText: био строитель
displayDescription: строитель

showInEditor: true
class: CustomUnitMetadata
price: 500
maxHp: 200
mass: 500

techLevel: 1
buildSpeed: 8.3s

canRepairBuildings: true
canRepairUnits : false

nanoRange: 70
nanoBuildSpeed: 0.9
