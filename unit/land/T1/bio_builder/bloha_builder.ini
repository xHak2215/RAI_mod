[core]
name: строитель_доходяга
displayText: био строитель
displayDescription: строитель

showInEditor: true
class: CustomUnitMetadata
price: 500
maxHp: 200
mass: 500

techLevel: 1
buildSpeed: 8.3s

canRepairBuildings: true
canRepairUnits: false

nanoRange: 70
nanoBuildSpeed: 0.9
nanoRepairSpeed: 0.7

tags: builder

radius: 8
displayRadius: 20

isBio: true

#общий патерн строений для всех строителей
copyFrom: ROOT:building_list.template

[graphics]
image_shadow: AUTO
image: body.png
#image_turret: турель.png

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

[hiddenAction_Ai_build_turret]
autoTriggerOnEvent: created
requireConditional: if self.isControlledByAI() and self.resource.credits > 1000
addWaypoint_target_fromReference: self.getOffsetRelative(y=50).nearestUnit(withinRange=70, withTag='extractor') 
addWaypoint_type: build
addWaypoint_unitType: turret_T1


[leg_1]
x: -10
y: 6
attach_x: -1
attach_y: 5
moveSpeed: 4

heightSpeed: 3
moveWarmUp: 2

resetAngle: 10

holdDisMin_maxMovingLegs: 4
holdDisMin: 1
holdDisMax: 2

dust_effect: false
image_leg: leg.png
image_foot: foot.png
estimatingPositionMultiplier: 0.4

[leg_2]
@copyFromSection: leg_1
x: 10
y: 6
attach_x: 1
attach_y: 5
estimatingPositionMultiplier: 0.4

[leg_3]
@copyFromSection: leg_1
moveWarmUp: 1
x: -10
y: -10
attach_x: -1
attach_y: -5
estimatingPositionMultiplier: 0.4

[leg_4]
@copyFromSection: leg_1
moveWarmUp: 1
x: 10
y: -10
attach_x: 1
attach_y: -5
estimatingPositionMultiplier: 0.4

