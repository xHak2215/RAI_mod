[core]
name: T1_mach_artillery
displayText: mach artillery
displayText_ru: мех. артилерия
displayDescription: механизированая артелерия, большой радиус, не высокая скорость

showInEditor: true
class: CustomUnitMetadata
price: 1100
maxHp: 650
mass: 1550

techLevel: 1
buildSpeed: 10s

radius: 15
displayRadius: 20

[graphics]
image_shadow: AUTO
image: body.png

# это нужно что бы скрипить турель 0 и создаль эффект отдачи не только пушки но и всего корпуса
lock_body_rotation_with_main_turret: true

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretTurnSpeed: 0
isFixedFiring: true

shootDelay: 2s

maxAttackRange: 280

[turret_1]
x: 0
y: 0
image: ROOT:icons/nah_sprite.png

aimOffsetSpread: 0
delay: 2.21s
projectile: null_projectile

recoilOffset: -2
recoilOutTime: 5
recoilReturnTime: 20

[turret_2]
x: -1
y: 10

attachedTo: 1
slave: true 

image: turret.png
aimOffsetSpread: 0
projectile: 1

recoilOffset: -4
recoilOutTime: 4
recoilReturnTime: 10

[projectile_1]
areaDamage: 70
areaRadius: 55

image: ROOT:effect/arta_projectile.png

life: 80
speed: 3.8
frame: 2

drawSize: 0.65

[leg_1]
x: -18
y: 8
attach_x: -5
attach_y: 4
moveSpeed: 1.4

heightSpeed: 2
moveWarmUp: 6

resetAngle: 15
image_end_teamColors: true

holdDisMin_maxMovingLegs: 4
holdDisMin: 1
holdDisMax: 2.3
hardLimit: 16

dust_effect: true
image_leg: artilery_leg.png
image_foot: artilery_foot.png
estimatingPositionMultiplier: 0.55

[leg_2]
@copyFromSection: leg_1
x: 18
y: 8
attach_x: 5
attach_y: 4

[leg_3]
@copyFromSection: leg_1
moveWarmUp: 1
x: -18
y: -17
attach_x: -5
attach_y: -5

[leg_4]
@copyFromSection: leg_1
moveWarmUp: 1
x: 18
y: -17
attach_x: 5
attach_y: -5

[movement]
movementType: OVER_CLIFF

moveSpeed: 0.62
moveAccelerationSpeed: 0.06
moveDecelerationSpeed: 0.15

maxTurnSpeed: 2
turnAcceleration: 0.2

reverseSpeedPercentage: 0.25

moveSlidingMode :false
moveIgnoringBody:false