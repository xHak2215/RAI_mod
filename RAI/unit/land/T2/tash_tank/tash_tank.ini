life: 100
frame: 1

[effect_explore_b]
image: ROOT:/effect/fire.png

total_frames: 4
animateFrameStart: 0 
animateFrameSpeed: 1
animateFrameEnd: 3

life: 300

[effect_flame]
image: ROOT:/effect/fire.png 
life: 500

alpha: 1
total_frames: 4
animateFrameStart: 0 
animateFrameSpeed: 0.5
animateFrameEnd: 3

[effect_shot_fire]
image: ROOT:/effect/miniature_roket_fire_8_frme.png

